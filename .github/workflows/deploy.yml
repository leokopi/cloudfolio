name: Deploy CloudFolio

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Package Lambda functions
        run: |
          for func in get_portfolio post_holding get_prices delete_holding; do
            cd backend/$func
            zip -j ../../$func.zip lambda_function.py
            cd ../..
          done

      - name: Upload Lambda zips to S3
        run: |
          for func in get_portfolio post_holding get_prices delete_holding; do
            aws s3 cp $func.zip s3://${{ secrets.DEPLOY_BUCKET }}/$func.zip
          done

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation.yaml \
            --stack-name cloudfolio \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              GoogleClientId=${{ secrets.GOOGLE_CLIENT_ID }} \
              GoogleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} \
              PolygonApiKey=${{ secrets.POLYGON_API_KEY }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code --function-name cloudfolio-get-portfolio --s3-bucket ${{ secrets.DEPLOY_BUCKET }} --s3-key get_portfolio.zip
          aws lambda update-function-code --function-name cloudfolio-post-holding --s3-bucket ${{ secrets.DEPLOY_BUCKET }} --s3-key post_holding.zip
          aws lambda update-function-code --function-name cloudfolio-get-prices --s3-bucket ${{ secrets.DEPLOY_BUCKET }} --s3-key get_prices.zip
          aws lambda update-function-code --function-name cloudfolio-delete-holding --s3-bucket ${{ secrets.DEPLOY_BUCKET }} --s3-key delete_holding.zip

      - name: Get stack outputs
        id: stack
        run: |
          echo "bucket=$(aws cloudformation describe-stacks --stack-name cloudfolio --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)" >> $GITHUB_OUTPUT
          echo "dist_id=$(aws cloudformation describe-stacks --stack-name cloudfolio --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)" >> $GITHUB_OUTPUT

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/ s3://${{ steps.stack.outputs.bucket }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ steps.stack.outputs.dist_id }} --paths "/*"
