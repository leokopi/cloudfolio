name: Deploy CloudFolio

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-2
  STACK_NAME: cloudfolio
  FRONTEND_BUCKET: cloudfolio-frontend-594552272210
  CLOUDFRONT_DIST_ID: E57RX2DMWF5JY

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and upload Lambda zips
        run: |
          for func in get_portfolio post_holding get_prices delete_holding get_market; do
            cd backend/$func
            zip -j ../../$func.zip lambda_function.py
            cd ../..
            aws s3 cp $func.zip s3://${{ secrets.DEPLOY_BUCKET }}/$func.zip
          done

      - name: Deploy CloudFormation stack
        continue-on-error: true
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              GoogleClientId=${{ secrets.GOOGLE_CLIENT_ID }} \
              GoogleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} \
              PolygonApiKey=${{ secrets.POLYGON_API_KEY }}

      - name: Redeploy API Gateway stage
        run: |
          aws apigateway create-deployment \
            --rest-api-id cdsyovnqe1 \
            --stage-name prod

      - name: Update Lambda function code
        run: |
          for func in get_portfolio post_holding get_prices delete_holding get_market; do
            aws lambda update-function-code \
              --function-name cloudfolio-$func \
              --s3-bucket ${{ secrets.DEPLOY_BUCKET }} \
              --s3-key $func.zip
          done

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/ s3://${{ env.FRONTEND_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
