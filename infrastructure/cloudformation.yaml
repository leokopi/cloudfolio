  # ── CloudWatch Monitoring (REL 6) ─────────────────────────────────────────
  LambdaErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloudfolio-lambda-error-rate
      AlarmDescription: Lambda error rate across all functions exceeds 1%
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 5
      Threshold: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: error_rate
          Expression: "IF(invocations > 0, 100 * errors / invocations, 0)"
          Label: "Lambda Error Rate %"
          ReturnData: true

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloudfolio-apigw-5xx
      AlarmDescription: API Gateway 5XX error rate exceeds 1%
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: cloudfolio-api
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 0.01
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ApiGatewayLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloudfolio-apigw-latency
      AlarmDescription: API Gateway p99 latency exceeds 3 seconds
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: cloudfolio-api
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 3
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  CloudWatchDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: cloudfolio
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Errors vs Invocations",
                "metrics": [
                  ["AWS/Lambda", "Errors"],
                  ["AWS/Lambda", "Invocations"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway 5XX Errors",
                "metrics": [
                  ["AWS/ApiGateway", "5XXError", "ApiName", "cloudfolio-api"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway Latency (p99)",
                "metrics": [
                  ["AWS/ApiGateway", "Latency", "ApiName", "cloudfolio-api"]
                ],
                "period": 300,
                "extendedStatistic": "p99",
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB Consumed Capacity",
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "cloudfolio-holdings"],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "cloudfolio-holdings"],
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "cloudfolio-networth"],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "cloudfolio-networth"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod
    Description: Paste into frontend/app.js as API_BASE
  CloudFrontUrl:
    Value: !Sub https://${CloudFrontDistribution.DomainName}
    Description: Frontend URL
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub https://cloudfolio-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
  FrontendBucketName:
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
