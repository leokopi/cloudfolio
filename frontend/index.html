<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudFolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>CloudFolio</h1>
    <button id="logout-btn">Sign out</button>
  </header>

  <div class="app-layout">

    <!-- Left: live market data -->
    <aside class="sidebar" id="market-sidebar">
      <h3 class="sidebar-title">Markets</h3>
      <ul class="market-list" id="market-list">
        <li class="market-item skeleton"><span>S&amp;P 500</span><span>—</span></li>
        <li class="market-item skeleton"><span>Nasdaq</span><span>—</span></li>
        <li class="market-item skeleton"><span>Crude Oil</span><span>—</span></li>
        <li class="market-item skeleton"><span>Bitcoin</span><span>—</span></li>
      </ul>
    </aside>

    <!-- Centre: summary + add form -->
    <main>
      <div class="summary-row" id="summary-row">
        <div class="summary-card">
          <span class="summary-label">Total Value</span>
          <span class="summary-value" id="summary-total">$—</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">Total Gain / Loss</span>
          <span class="summary-value" id="summary-gain">—</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">Holdings</span>
          <span class="summary-value" id="summary-count">—</span>
        </div>
      </div>

      <section class="card" id="add-holding">
        <h2>Add Holding</h2>
        <form id="holding-form">
          <input type="text"   id="ticker"   placeholder="Ticker (e.g. AAPL)" required />
          <input type="number" id="shares"   placeholder="Shares" step="any" min="0" required />
          <input type="number" id="avg-cost" placeholder="Avg Cost ($)" step="any" min="0" required />
          <button type="submit" class="primary-btn">Add</button>
        </form>
        <p id="form-error" class="form-error"></p>
      </section>
    </main>

    <!-- Right: portfolio preview -->
    <aside class="sidebar" id="portfolio-sidebar">
      <h3 class="sidebar-title">My Portfolio</h3>
      <ul class="mini-holdings" id="mini-holdings">
        <li class="muted" style="font-size:0.85rem">No holdings yet.</li>
      </ul>
      <a href="/portfolio.html" class="view-full-btn">View Full Portfolio →</a>
    </aside>

  </div>

  <div id="toast-container"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
