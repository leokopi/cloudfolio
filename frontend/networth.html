<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudFolio — Net Worth</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <a href="/" class="back-link">← Dashboard</a>
      <h1>CloudFolio</h1>
    </div>
    <button id="logout-btn">Sign out</button>
  </header>

  <div class="portfolio-page">

    <div class="portfolio-hero">
      <div class="hero-total" id="networth-hero-total">$—</div>
      <div class="hero-change" id="networth-hero-sub"></div>
    </div>

    <section class="card">
      <h2>Assets</h2>
      <div id="assets-list"><p class="muted">Loading…</p></div>
    </section>

    <section class="card">
      <h2>Liabilities</h2>
      <div id="liabilities-list"><p class="muted">Loading…</p></div>
    </section>

    <section class="card">
      <h2>Add Item</h2>
      <form id="networth-form">
        <input type="text"   id="nw-name"  placeholder="Name (e.g. House, Car Loan)" required />
        <select id="nw-type">
          <option value="asset">Asset</option>
          <option value="liability">Liability</option>
        </select>
        <input type="number" id="nw-value" placeholder="Value ($)" step="any" min="0" required />
        <button type="submit" class="primary-btn">Add</button>
      </form>
      <p id="nw-form-error" class="form-error"></p>
    </section>

  </div>

  <div id="toast-container"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
