<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudFolio — Sign In</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <h1>CloudFolio</h1>
    <p>Track your stock portfolio in the cloud.</p>
    <button id="login-btn" class="primary-btn">Sign in with Google</button>
  </div>

  <script type="module">
    import { login, getToken } from "./app.js";
    if (getToken()) globalThis.location.replace("/");
    document.getElementById("login-btn").addEventListener("click", login);
  </script>
</body>
</html>
